name: Build release and multi-arch images
on:
  push:
    branches: [master]
    tags: ['v*']

permissions:
  contents: read

env:
  DIST_VERSION: v0.6.0

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Docker publishing configuration
        id: docker
        env:
          DOCKER_PASSWORD: ${{ secrets.DockerPass }}
        run: |
          if [ -n "$DOCKER_PASSWORD" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Docker publishing skipped: DockerPass is not configured.'
          fi
      - uses: docker/setup-qemu-action@v3
        if: steps.docker.outputs.enabled == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.docker.outputs.enabled == 'true'
      - uses: docker/login-action@v3
        if: steps.docker.outputs.enabled == 'true'
        with:
          username: zhangguanzhang
          password: ${{ secrets.DockerPass }}
      - name: Image metadata
        if: steps.docker.outputs.enabled == 'true'
        id: metadata
        run: |
          version=$(git describe --tags --always)
          tag=latest
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; version="$tag"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "ldflags=-s -w -X main.Version=$version -X main.gitCommit=$GITHUB_SHA -X main.gitTreeState=clean" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        if: steps.docker.outputs.enabled == 'true'
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          tags: zhangguanzhang/gonelist:${{ steps.metadata.outputs.tag }}
          build-args: |
            VERSION=${{ env.DIST_VERSION }}
            GOPROXY=https://proxy.golang.org,direct
            LDFLAGS=${{ steps.metadata.outputs.ldflags }}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Build installation packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash build/lib/all-release.sh
      - name: Publish packages and security notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Keep an already published, reviewed set of artifacts immutable.
            echo 'Release already exists; leaving its notes and assets unchanged.'
          else
            gh release create "$GITHUB_REF_NAME" release/gonelist_*.tar.gz release/SHA256SUMS \
              --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          fi
